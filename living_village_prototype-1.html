<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Living Village Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#75b96b}
#help{position:fixed;left:10px;top:10px;z-index:5;background:rgba(15,25,20,.82);color:white;padding:9px 12px;border-radius:12px;font-size:12px;line-height:1.35;pointer-events:none}
#title{font-weight:800;font-size:14px}
#hint{opacity:.8}
#stats{position:fixed;right:10px;top:10px;z-index:5;background:rgba(15,25,20,.82);color:white;padding:9px 12px;border-radius:12px;font-size:12px;pointer-events:none;text-align:right}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help"><div id="title">🌲 Living Village</div><div id="hint">Drag to explore • Characters have their own routines</div></div>
<div id="stats"></div>
<script>
"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)} resize(); addEventListener("resize",resize);

const world={w:4200,h:3000};
let cam={x:0,y:0}, dragging=false,last={x:0,y:0};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function sx(x){return x-cam.x+W/2} function sy(y){return y-cam.y+H/2}

c.addEventListener("pointerdown",e=>{dragging=true;last.x=e.clientX;last.y=e.clientY;c.setPointerCapture(e.pointerId)});
c.addEventListener("pointermove",e=>{if(!dragging)return;cam.x=clamp(cam.x-(e.clientX-last.x),W/2,world.w-W/2);cam.y=clamp(cam.y-(e.clientY-last.y),H/2,world.h-H/2);last.x=e.clientX;last.y=e.clientY});
c.addEventListener("pointerup",()=>dragging=false); c.addEventListener("pointercancel",()=>dragging=false);

const houses=[
 {x:850,y:820,w:170,h:130,name:"Pine Cabin",owner:0},
 {x:1160,y:980,w:170,h:130,name:"River Cabin",owner:1},
 {x:800,y:1220,w:170,h:130,name:"Oak Cabin",owner:2},
 {x:1260,y:1280,w:170,h:130,name:"Hill Cabin",owner:3},
 {x:980,y:1510,w:170,h:130,name:"Meadow Cabin",owner:4},
 {x:1470,y:1590,w:170,h:130,name:"Lakeside Cabin",owner:5},
 {x:680,y:1660,w:170,h:130,name:"Forest Cabin",owner:6},
 {x:1780,y:1260,w:170,h:130,name:"North Cabin",owner:7}
];

const castle={x:3000,y:620,w:700,h:560};
const pond={x:2750,y:1840,w:1150,h:700};

const trees=[];
const treeSpots=[[420,650],[590,740],[520,1010],[420,1250],[560,1450],[400,1720],[620,1950],[830,2050],[1050,2180],[1370,2110],[1580,2270],[1840,2140],[2080,2300],[2270,1980],[2440,2160],[3650,1450],[3820,1580],[3500,1330],[3920,1250],[3100,1430],[2350,920],[2100,740],[1880,610],[1500,550],[1150,620]];
for(let i=0;i<treeSpots.length;i++) trees.push({x:treeSpots[i][0],y:treeSpots[i][1],alive:true,respawn:0,shake:0});

const names=["Milo","Nora","Finn","Lena","Owen","Mia","Leo","Ivy"];
const colors=["#d97745","#5577bb","#8b5fbf","#d4a72c","#4b9b72","#c85c7c","#6b879d","#9b7048"];
const villagers=names.map((name,i)=>({
 name,x:houses[i].x+houses[i].w/2+(i%2?18:-18),y:houses[i].y+houses[i].h+35,
 home:i,state:"home",target:null,carry:null,food:65+Math.random()*30,
 speed:38+Math.random()*10,phase:Math.random()*6,wait:0,work:0,fish:0,
 dir:1,color:colors[i],lastState:""
}));

const logs=[],fish=[],guards=[];
for(let i=0;i<5;i++) guards.push({x:castle.x+110+i*125,y:castle.y+castle.h-100+(i%2)*55,angle:i*1.25,speed:24+Math.random()*8,phase:i});
const king={x:castle.x+castle.w/2,y:castle.y+castle.h/2+25,phase:0};

let resources={wood:0,fish:0};
const particles=[];
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function near(a,b,r){return dist(a,b)<r}
function pointInHouse(v,h){return v.x>h.x+10&&v.x<h.x+h.w-10&&v.y>h.y+10&&v.y<h.y+h.h-10}
function chooseTask(v){
  v.food-=8;
  if(v.food<22){v.state="eat";v.wait=2.5;return}
  // alternate between wood and fishing, with some wandering
  if(v.home%3===0 || resources.wood<9){
    let candidates=trees.filter(t=>t.alive).sort((a,b)=>dist(v,a)-dist(v,b));
    v.target=candidates[0]||null; if(v.target){v.state="toTree";return}
  }
  if(v.home%3!==0 || resources.fish<7){
    v.target={x:pond.x+180+Math.random()*(pond.w-360),y:pond.y+100+Math.random()*(pond.h-220)};
    v.state="toFish";return
  }
  v.target={x:400+Math.random()*2200,y:400+Math.random()*1900};v.state="wander";
}
function moveToward(v,t,dt){
  let dx=t.x-v.x,dy=t.y-v.y,d=Math.hypot(dx,dy)||1;
  v.dir=dx>=0?1:-1; let step=Math.min(d,v.speed*dt);
  v.x+=dx/d*step;v.y+=dy/d*step;return d;
}
function spawnText(x,y,text){particles.push({x,y,text,life:1.5,vy:-20})}

function updateVillager(v,dt){
  v.phase+=dt*8; v.food-=dt*.55;
  if(v.wait>0){v.wait-=dt;return}
  if(v.state==="home"){ if(Math.random()<.008)chooseTask(v); return}
  if(v.state==="eat"){
    if(v.wait<=0){v.wait=2.5;v.food=Math.min(100,v.food+55);spawnText(v.x,v.y-25,"🍎 eating")}
    return;
  }
  if(v.state==="toTree"){
    if(!v.target||!v.target.alive){chooseTask(v);return}
    if(moveToward(v,v.target,dt)<22){v.state="chop";v.work=3.2;v.target.shake=0}
  } else if(v.state==="chop"){
    v.work-=dt;v.target.shake=Math.sin(v.work*20)*5;
    if(v.work<=0){
      const t=v.target;t.alive=false;t.respawn=20;
      for(let j=0;j<3;j++)logs.push({x:t.x+(j-1)*15,y:t.y+22});
      spawnText(t.x,t.y-25,"🌲 chopped!");
      v.target=null;v.state="toLogs";
    }
  } else if(v.state==="toLogs"){
    let l=logs.find(q=>!q.taken);
    if(!l){chooseTask(v);return}
    if(moveToward(v,l,dt)<18){l.taken=true;v.carry="🪵";v.state="toHome";v.target=houses[v.home]}
  } else if(v.state==="toFish"){
    if(moveToward(v,v.target,dt)<12){v.state="fish";v.fish=3.2}
  } else if(v.state==="fish"){
    v.fish-=dt;
    if(v.fish<=0){
      fish.push({x:v.x,y:v.y-10});
      v.carry="🐟";spawnText(v.x,v.y-28,"🐟 catch!");
      v.state="toHome";v.target=houses[v.home]
    }
  } else if(v.state==="wander"){
    if(moveToward(v,v.target,dt)<10)chooseTask(v)
  } else if(v.state==="toHome"){
    const h=v.target, entry={x:h.x+h.w/2,y:h.y+h.h+8};
    if(moveToward(v,entry,dt)<13){
      if(v.carry==="🪵")resources.wood+=1;
      if(v.carry==="🐟")resources.fish+=1;
      v.carry=null;v.state="inside";v.wait=2.2;spawnText(h.x+h.w/2,h.y-8,"🏠 stored");
    }
  } else if(v.state==="inside"){
    if(v.wait<=0){v.x=v.target.x+v.target.w/2;v.y=v.target.y+v.target.h+35;chooseTask(v)}
  }
}
function drawBackground(){
  ctx.fillStyle="#78bd70";ctx.fillRect(0,0,W,H);
  // subtle grid / paths
  ctx.strokeStyle="rgba(255,255,255,.06)";ctx.lineWidth=1;
  for(let x=Math.floor((cam.x-W/2)/100)*100;x<cam.x+W/2+100;x+=100){ctx.beginPath();ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),H);ctx.stroke()}
  for(let y=Math.floor((cam.y-H/2)/100)*100;y<cam.y+H/2+100;y+=100){ctx.beginPath();ctx.moveTo(0,sy(y));ctx.lineTo(W,sy(y));ctx.stroke()}
  // roads
  ctx.strokeStyle="#c6a86b";ctx.lineWidth=34;ctx.lineCap="round";
  [[700,1050,1800,1050],[1000,1450,1900,1450],[1700,1450,3000,1800],[1800,1050,3000,1050]].forEach(p=>{ctx.beginPath();ctx.moveTo(sx(p[0]),sy(p[1]));ctx.lineTo(sx(p[2]),sy(p[3]));ctx.stroke()});
  // pond
  ctx.fillStyle="#4b9fcb";ctx.beginPath();ctx.ellipse(sx(pond.x+pond.w/2),sy(pond.y+pond.h/2),pond.w/2,pond.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.12)";for(let i=0;i<8;i++){let px=pond.x+150+i*130;let py=pond.y+120+(i%4)*100;ctx.beginPath();ctx.ellipse(sx(px),sy(py),45,7,0,0,Math.PI*2);ctx.fill()}
}
function drawTree(t){
  if(!t.alive)return;
  let x=sx(t.x+t.shake),y=sy(t.y);
  ctx.fillStyle="#6f482b";ctx.fillRect(x-6,y+8,12,35);
  ctx.fillStyle="#236c38";ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#2f8242";ctx.beginPath();ctx.arc(x-18,y+8,22,0,Math.PI*2);ctx.arc(x+18,y+8,22,0,Math.PI*2);ctx.fill();
}
function drawHouse(h){
  let x=sx(h.x),y=sy(h.y);
  ctx.fillStyle="#9b6b42";ctx.fillRect(x,y+35,h.w,h.h-35);
  ctx.fillStyle="#70452f";ctx.beginPath();ctx.moveTo(x-12,y+38);ctx.lineTo(x+h.w/2,y-25);ctx.lineTo(x+h.w+12,y+38);ctx.closePath();ctx.fill();
  ctx.fillStyle="#3e3027";ctx.fillRect(x+h.w/2-15,y+h.h-55,30,55);
  ctx.fillStyle="#a9d9e8";ctx.fillRect(x+25,y+65,30,28);ctx.fillRect(x+h.w-55,y+65,30,28);
  ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(h.name,x+h.w/2,y-34);
}
function drawCastle(){
  let x=sx(castle.x),y=sy(castle.y);
  ctx.fillStyle="#b8a9a0";ctx.fillRect(x+90,y+120,castle.w-180,castle.h-120);
  ctx.fillStyle="#87766e";
  [[0,0],[castle.w-150,0],[0,castle.h-170],[castle.w-150,castle.h-170]].forEach(q=>ctx.fillRect(x+q[0],y+q[1],150,170));
  ctx.fillStyle="#65544d";ctx.fillRect(x+castle.w/2-45,y+castle.h-115,90,115);
  ctx.fillStyle="#6e4b8b";ctx.beginPath();ctx.moveTo(x+castle.w/2-65,y+120);ctx.lineTo(x+castle.w/2,y+40);ctx.lineTo(x+castle.w/2+65,y+120);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText("KING'S CASTLE",x+castle.w/2,y-28);
}
function drawHuman(v){
  let x=sx(v.x),y=sy(v.y),walk=(Math.sin(v.phase)*7)*(v.state==="chop"||v.state==="fish"||v.state==="eat"?0:1);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(x,y+14,10,4,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle="#2f3440";ctx.lineWidth=3;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x-3,y+2);ctx.lineTo(x-5+walk,y+14);ctx.moveTo(x+3,y+2);ctx.lineTo(x+5-walk,y+14);ctx.stroke();
  // body
  ctx.fillStyle=v.color;ctx.beginPath();ctx.ellipse(x,y-2,7,10,0,0,Math.PI*2);ctx.fill();
  // arms
  let arm=walk*.8;
  ctx.strokeStyle=v.color;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-6,y-5);ctx.lineTo(x-10-arm,y+4);ctx.moveTo(x+6,y-5);ctx.lineTo(x+10+arm,y+4);ctx.stroke();
  // head
  ctx.fillStyle="#f1c39b";ctx.beginPath();ctx.arc(x,y-15,6,0,Math.PI*2);ctx.fill();
  // hair
  ctx.fillStyle="#553b2b";ctx.beginPath();ctx.arc(x,y-17,6,Math.PI,Math.PI*2);ctx.fill();
  if(v.carry){ctx.font="16px system-ui";ctx.textAlign="center";ctx.fillText(v.carry,x,y-29)}
  if(v.state==="chop"){
    ctx.strokeStyle="#8b5a32";ctx.lineWidth=3;let a=Math.sin(performance.now()/100)*.9;
    ctx.beginPath();ctx.moveTo(x+5,y-2);ctx.lineTo(x+20,y-13);ctx.stroke();
    ctx.strokeStyle="#aaa";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+19,y-13);ctx.lineTo(x+26,y-19);ctx.stroke();
  }
  if(v.state==="fish"){
    ctx.strokeStyle="#68462c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+5,y-5);ctx.lineTo(x+18,y-28);ctx.stroke();
    ctx.strokeStyle="#eee";ctx.beginPath();ctx.moveTo(x+18,y-28);ctx.lineTo(x+30,y-7);ctx.stroke();
  }
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.font="9px system-ui";ctx.textAlign="center";ctx.fillText(v.name,x,y+27);
}
function drawKing(){
  let x=sx(king.x),y=sy(king.y),bob=Math.sin(king.phase)*2;
  ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(x,y+20,13,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#5d3d8d";ctx.beginPath();ctx.ellipse(x,y,12,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f1c39b";ctx.beginPath();ctx.arc(x,y-18+bob,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#f0c53d";ctx.beginPath();ctx.moveTo(x-10,y-24+bob);ctx.lineTo(x-6,y-34+bob);ctx.lineTo(x,y-27+bob);ctx.lineTo(x+5,y-35+bob);ctx.lineTo(x+10,y-24+bob);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.fillText("KING",x,y+34);
}
function drawGuard(g){
  let x=sx(g.x),y=sy(g.y),bob=Math.sin(g.phase)*1.5;
  ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(x,y+14,9,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#46566a";ctx.fillRect(x-7,y-5,14,19);
  ctx.fillStyle="#d8c5ae";ctx.beginPath();ctx.arc(x,y-11+bob,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#59606b";ctx.fillRect(x-7,y-17+bob,14,5);
  ctx.strokeStyle="#9a9a9a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+8,y-5);ctx.lineTo(x+8,y-24);ctx.stroke();
}
function drawLogs(){
  logs.forEach(l=>{if(l.taken)return;let x=sx(l.x),y=sy(l.y);ctx.save();ctx.translate(x,y);ctx.rotate(.2);ctx.fillStyle="#8b5b35";ctx.fillRect(-11,-3,22,7);ctx.fillStyle="#d7a16c";ctx.beginPath();ctx.arc(-11,0,4,0,Math.PI*2);ctx.fill();ctx.restore()});
}
function drawFish(){
  fish.forEach(f=>{let x=sx(f.x),y=sy(f.y);ctx.font="18px system-ui";ctx.textAlign="center";ctx.fillText("🐟",x,y)});
}
function draw(){
  ctx.clearRect(0,0,W,H);drawBackground();
  trees.forEach(drawTree);houses.forEach(drawHouse);drawCastle();drawLogs();drawFish();
  guards.forEach(drawGuard);drawKing();villagers.forEach(drawHuman);
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#fff";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(p.text,sx(p.x),sy(p.y));ctx.globalAlpha=1});
  document.getElementById("stats").innerHTML=`🏠 ${houses.length} homes &nbsp; 👥 ${villagers.length} villagers<br>🪵 ${resources.wood} wood &nbsp; 🐟 ${resources.fish} fish<br>🌲 ${trees.filter(t=>t.alive).length} trees`;
}
let lastTime=performance.now();
function loop(now){
  let dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;
  trees.forEach(t=>{if(!t.alive){t.respawn-=dt;if(t.respawn<=0)t.alive=true}});
  villagers.forEach(v=>updateVillager(v,dt));
  guards.forEach(g=>{g.phase+=dt*4;g.angle+=dt*g.speed*.025;g.x=castle.x+castle.w/2+Math.cos(g.angle)*270;g.y=castle.y+castle.h/2+Math.sin(g.angle)*180});
  king.phase+=dt*4;
  particles.forEach(p=>{p.life-=dt;p.y+=p.vy*dt});for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
  draw();requestAnimationFrame(loop);
}
cam.x=world.w/2;cam.y=world.h/2;requestAnimationFrame(loop);
</script>
</body>
</html>
